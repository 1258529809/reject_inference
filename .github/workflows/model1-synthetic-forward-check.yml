name: Model 1 synthetic forward check

on:
  workflow_dispatch:
  push:
    branches:
      - codex/model1-cpu-env-check
    paths:
      - .github/workflows/model1-synthetic-forward-check.yml

permissions:
  contents: read

jobs:
  synthetic-forward-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Sparse checkout Model 1 source only
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            python/model1
          sparse-checkout-cone-mode: false

      - name: Verify no data or weights were checked out
        shell: bash
        run: |
          set -euo pipefail
          test -d python/model1
          test ! -e data
          test ! -e output

      - name: Pull pinned author image
        shell: bash
        env:
          IMAGE: rogelioandrade/theano_setup@sha256:69c334b33ae5df566d8f17363428bb5a7030743f7bcc7ba27ab29e616f7b848f
        run: |
          set -euo pipefail
          docker pull "${IMAGE}"

      - name: Build original Model 1 graph and run synthetic forward functions
        shell: bash
        env:
          IMAGE: rogelioandrade/theano_setup@sha256:69c334b33ae5df566d8f17363428bb5a7030743f7bcc7ba27ab29e616f7b848f
        run: |
          set -euo pipefail
          docker run --rm -i \
            --network none \
            --cpus 2 \
            --memory 8g \
            --pids-limit 512 \
            --security-opt=no-new-privileges:true \
            --read-only \
            --tmpfs /tmp:rw,exec,nosuid,size=1g \
            -e HOME=/tmp \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e THEANO_FLAGS=device=cpu,floatX=float32,base_compiledir=/tmp/theano \
            -v "${GITHUB_WORKSPACE}/python/model1:/work/model1:ro" \
            -w /work/model1 \
            "${IMAGE}" /bin/bash -s <<'CONTAINER_SCRIPT'
          set -eu
          test ! -e /work/data
          test ! -e /root/data

          python - <<'PYTHON_CHECK'
          import numpy as np

          from SS_M1 import SS_M1

          class Args(object):
              pass

          args = Args()
          args.lr_u = 0.0001
          args.lr_l = 0.0001
          args.batch_size = 4
          args.hdim_cls = [5]
          args.hdim_enc = [5]
          args.hdim_dec = [5]
          args.hdim_gmm = [5]
          args.zdim = 3
          args.dec = "gaussian"
          args.num_k = 2
          args.nlayers_enc = 1
          args.nlayers_dec = 1
          args.nlayers_cls = 1
          args.nlayers_gmm = 1
          args.dropout_rate = 0.01
          args.hl_activation = "softplus"

          xdim = 6
          num_classes = 2
          model = SS_M1(
              xdim=xdim,
              num_classes=num_classes,
              alpha=1.1,
              args=args,
              enc_weights=None,
              dec_weights=None,
              cls_weights=None,
              gmm_weights=None,
          )
          print("SS_M1 graph construction: OK")

          rng = np.random.RandomState(7)
          x = rng.normal(size=(args.batch_size, xdim)).astype("float32")
          eps = rng.normal(size=(args.batch_size, args.zdim)).astype("float32")
          y = np.eye(num_classes, dtype="float32")[
              np.asarray([0, 1, 0, 1], dtype="int32")
          ]
          inference_mode = np.asarray(0.0, dtype="float32")

          pi = model.draw_pi(x, inference_mode)
          predicted_one_hot = model.predict_label(x, inference_mode)
          z = model.draw_sample(x, eps, y, inference_mode)
          reconstruction_nll = model.dec_cost(x, z, inference_mode)
          params = model.all_params()

          assert pi.shape == (args.batch_size, num_classes)
          assert predicted_one_hot.shape == (args.batch_size, num_classes)
          assert z.shape == (args.batch_size, args.zdim)
          assert reconstruction_nll.shape == (args.batch_size,)
          assert np.all(np.isfinite(pi))
          assert np.all(np.isfinite(z))
          assert np.all(np.isfinite(reconstruction_nll))
          assert np.allclose(pi.sum(axis=1), 1.0, atol=1e-5)
          assert np.allclose(predicted_one_hot.sum(axis=1), 1.0)
          assert len(params) > 0

          print("Classifier probabilities shape: {}".format(pi.shape))
          print("Classifier row sums: {}".format(pi.sum(axis=1)))
          print("Predicted one-hot shape: {}".format(predicted_one_hot.shape))
          print("Encoder sample shape: {}".format(z.shape))
          print("Decoder reconstruction NLL shape: {}".format(reconstruction_nll.shape))
          print("Parameter arrays returned: {}".format(len(params)))
          print("All synthetic forward outputs are finite")
          print("No labeled/unlabeled cost graph was requested")
          print("No optimizer or training update was created")
          print("No repository data or weights were mounted or deserialized")
          PYTHON_CHECK
          CONTAINER_SCRIPT
