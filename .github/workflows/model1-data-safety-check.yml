name: Model 1 data safety and schedule check

on:
  workflow_dispatch:
  push:
    branches:
      - codex/model1-cpu-env-check
    paths:
      - .github/workflows/model1-data-safety-check.yml

permissions:
  contents: read

env:
  BASELINE_SHA: 648665b5f11490ddd28895dcc4ee452bf643246a
  IMAGE: rogelioandrade/theano_setup@sha256:69c334b33ae5df566d8f17363428bb5a7030743f7bcc7ba27ab29e616f7b848f

jobs:
  data-safety-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout immutable paper data and history
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASELINE_SHA }}
          fetch-depth: 0
          persist-credentials: false
          sparse-checkout: |
            data/supervised_lc_paper.pk.gz
            data/unsupervised_lc_paper.pk.gz
          sparse-checkout-cone-mode: false

      - name: Verify Git blobs, history, compression, and cryptographic hashes
        shell: bash
        run: |
          set -euo pipefail
          declare -A expected_blobs=(
            [data/supervised_lc_paper.pk.gz]=63e87ab586d25f6109310eb71206267d6897c739
            [data/unsupervised_lc_paper.pk.gz]=ffe372541611db4a66504fc49186401aef642123
          )
          declare -A expected_sizes=(
            [data/supervised_lc_paper.pk.gz]=854027
            [data/unsupervised_lc_paper.pk.gz]=3011684
          )

          for path in data/supervised_lc_paper.pk.gz data/unsupervised_lc_paper.pk.gz; do
            actual_blob="$(git hash-object -- "${path}")"
            actual_size="$(stat -c '%s' -- "${path}")"
            test "${actual_blob}" = "${expected_blobs[${path}]}"
            test "${actual_size}" = "${expected_sizes[${path}]}"
            echo "FILE=${path}"
            echo "SIZE_BYTES=${actual_size}"
            echo "GIT_BLOB_SHA1=${actual_blob}"
            sha256sum -- "${path}"
            sha512sum -- "${path}"
            file --brief -- "${path}"
            printf 'MAGIC_HEX='
            od -An -tx1 -N2 -- "${path}" | tr -d ' \n'
            printf '\n'
            gzip -t -- "${path}"
            echo "GZIP_TEST=PASS"
            git log --follow --format='HISTORY=%H|%aI|%an|%G?' -- "${path}"
          done

      - name: Pull pinned author image
        shell: bash
        run: |
          set -euo pipefail
          docker pull "${IMAGE}"
          docker image inspect "${IMAGE}" --format 'IMAGE={{index .RepoDigests 0}} ARCH={{.Architecture}} OS={{.Os}} SIZE={{.Size}}'

      - name: Static pickle opcode inspection without object construction
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i \
            --network none \
            --user 65534:65534 \
            --cpus 2 \
            --memory 2g \
            --memory-swap 2g \
            --pids-limit 64 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            -e HOME=/tmp \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -v "${GITHUB_WORKSPACE}/data:/data:ro" \
            -w /tmp \
            "${IMAGE}" /bin/bash -s <<'CONTAINER_SCRIPT'
          set -eu
          test "$(id -u)" != 0
          test ! -w /data/supervised_lc_paper.pk.gz
          test ! -w /data/unsupervised_lc_paper.pk.gz
          python - <<'PYTHON_SCAN'
          from __future__ import print_function
          import collections
          import gzip
          import os
          import pickletools

          paths = [
              '/data/supervised_lc_paper.pk.gz',
              '/data/unsupervised_lc_paper.pk.gz',
          ]
          max_uncompressed = 512 * 1024 * 1024
          allowed_globals = set([
              ('numpy.core.multiarray', '_reconstruct'),
              ('numpy', 'ndarray'),
              ('numpy', 'dtype'),
          ])
          forbidden_opcodes = set([
              'INST', 'OBJ', 'NEWOBJ', 'NEWOBJ_EX', 'STACK_GLOBAL',
              'EXT1', 'EXT2', 'EXT4', 'PERSID', 'BINPERSID',
          ])

          def global_pair(argument):
              parts = str(argument).replace('\n', ' ').split()
              if len(parts) != 2:
                  raise RuntimeError('Malformed GLOBAL argument: {!r}'.format(argument))
              return tuple(parts)

          for path in paths:
              total = 0
              with gzip.open(path, 'rb') as handle:
                  while True:
                      chunk = handle.read(1024 * 1024)
                      if not chunk:
                          break
                      total += len(chunk)
                      if total > max_uncompressed:
                          raise RuntimeError('Uncompressed-size ceiling exceeded for {}'.format(path))

              counts = collections.Counter()
              globals_seen = set()
              forbidden_seen = set()
              with gzip.open(path, 'rb') as handle:
                  for opcode, argument, position in pickletools.genops(handle):
                      counts[opcode.name] += 1
                      if opcode.name == 'GLOBAL':
                          globals_seen.add(global_pair(argument))
                      if opcode.name in forbidden_opcodes:
                          forbidden_seen.add(opcode.name)
                  trailing = handle.read(1)

              unexpected_globals = globals_seen - allowed_globals
              print('STATIC_FILE={}'.format(os.path.basename(path)))
              print('UNCOMPRESSED_BYTES={}'.format(total))
              print('PICKLE_GLOBALS={}'.format(sorted(globals_seen)))
              print('REDUCE_COUNT={}'.format(counts['REDUCE']))
              print('BUILD_COUNT={}'.format(counts['BUILD']))
              print('FORBIDDEN_OPCODES={}'.format(sorted(forbidden_seen)))
              print('UNEXPECTED_GLOBALS={}'.format(sorted(unexpected_globals)))
              print('TRAILING_BYTES_AFTER_STOP={}'.format(bool(trailing)))
              if forbidden_seen or unexpected_globals or trailing:
                  raise RuntimeError('Static pickle safety gate failed for {}'.format(path))
              print('STATIC_GATE=PASS')
          PYTHON_SCAN
          CONTAINER_SCRIPT

      - name: Restricted aggregate-only data contract parsing
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i \
            --network none \
            --user 65534:65534 \
            --cpus 2 \
            --memory 2g \
            --memory-swap 2g \
            --pids-limit 64 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=64m \
            -e HOME=/tmp \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -v "${GITHUB_WORKSPACE}/data:/data:ro" \
            -w /tmp \
            "${IMAGE}" /bin/bash -s <<'CONTAINER_SCRIPT'
          set -eu
          test "$(id -u)" != 0
          python - <<'PYTHON_CONTRACT'
          from __future__ import print_function
          import gzip
          import os
          import pickle
          import numpy as np

          allowed = {
              ('numpy.core.multiarray', '_reconstruct'): np.core.multiarray._reconstruct,
              ('numpy', 'ndarray'): np.ndarray,
              ('numpy', 'dtype'): np.dtype,
          }

          class RestrictedUnpickler(pickle.Unpickler):
              def find_class(self, module, name):
                  key = (module, name)
                  if key not in allowed:
                      raise pickle.UnpicklingError('Forbidden global: {}.{}'.format(module, name))
                  return allowed[key]

              def find_global(self, module, name):
                  return self.find_class(module, name)

              def persistent_load(self, pid):
                  raise pickle.UnpicklingError('Persistent IDs are forbidden')

          def restricted_load(path):
              with gzip.open(path, 'rb') as handle:
                  return RestrictedUnpickler(handle).load()

          def validate_mapping(path, expected_keys):
              obj = restricted_load(path)
              if type(obj) is not dict:
                  raise TypeError('Top-level object must be an exact dict')
              if any(not isinstance(key, basestring) for key in obj):
                  raise TypeError('All dictionary keys must be strings')
              keys = sorted(obj.keys())
              if set(keys) != set(expected_keys):
                  raise ValueError('Unexpected dictionary key set: {}'.format(keys))
              for key, value in obj.items():
                  if type(value) is not np.ndarray:
                      raise TypeError('Value for {} must be an exact ndarray'.format(key))
                  if value.dtype.kind not in 'biufc':
                      raise TypeError('Non-numeric dtype for {}'.format(key))
              return obj

          def array_stats(prefix, array):
              finite = np.isfinite(array)
              print('{}_SHAPE={}'.format(prefix, tuple(array.shape)))
              print('{}_DTYPE={}'.format(prefix, array.dtype))
              print('{}_NAN_COUNT={}'.format(prefix, int(np.isnan(array).sum())))
              print('{}_INF_COUNT={}'.format(prefix, int(np.isinf(array).sum())))
              print('{}_FINITE_COUNT={}'.format(prefix, int(finite.sum())))

          supervised_path = '/data/supervised_lc_paper.pk.gz'
          unsupervised_path = '/data/unsupervised_lc_paper.pk.gz'
          supervised = validate_mapping(supervised_path, ['data', 'labels'])
          unsupervised = validate_mapping(unsupervised_path, ['data'])

          for name, mapping in [('SUPERVISED', supervised), ('UNSUPERVISED', unsupervised)]:
              print('{}_KEYS={}'.format(name, sorted(mapping.keys())))
              data = mapping['data']
              if data.ndim != 2 or data.shape[1] < 2:
                  raise ValueError('{} data must be a 2-D date-plus-features matrix'.format(name))
              array_stats('{}_DATA'.format(name), data)
              dates = data[:, 0]
              if not np.isfinite(dates).all():
                  raise ValueError('{} date column is not finite'.format(name))
              print('{}_SAMPLES={}'.format(name, data.shape[0]))
              print('{}_FEATURE_COLUMNS={}'.format(name, data.shape[1] - 1))
              print('{}_DATE_MIN={}'.format(name, dates.min()))
              print('{}_DATE_MAX={}'.format(name, dates.max()))

          labels = supervised['labels']
          if labels.ndim != 2 or labels.shape[0] != supervised['data'].shape[0] or labels.shape[1] < 1:
              raise ValueError('Labels must be a 2-D matrix aligned with supervised data')
          array_stats('SUPERVISED_LABELS', labels)
          values, counts = np.unique(labels[:, 0], return_counts=True)
          print('PRIMARY_LABEL_VALUES={}'.format(values.tolist()))
          print('PRIMARY_LABEL_COUNTS={}'.format(counts.tolist()))
          print('PRIMARY_LABEL_CLASS_COUNT={}'.format(values.size))
          if not np.array_equal(values, np.asarray([0, 1], dtype=values.dtype)):
              raise ValueError('Primary labels are not exactly binary 0/1')
          print('DATA_CONTRACT=PASS')
          PYTHON_CONTRACT
          CONTAINER_SCRIPT

  compiled-schedule-check:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout immutable Model 1 source only
        uses: actions/checkout@v4
        with:
          ref: ${{ env.BASELINE_SHA }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            python/model1
          sparse-checkout-cone-mode: false

      - name: Pull pinned author image
        shell: bash
        run: |
          set -euo pipefail
          docker pull "${IMAGE}"

      - name: Verify compiled learning-rate and alpha behavior with random tensors
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm -i \
            --network none \
            --user 65534:65534 \
            --cpus 2 \
            --memory 2g \
            --memory-swap 2g \
            --pids-limit 128 \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --read-only \
            --tmpfs /tmp:rw,noexec,nosuid,size=512m \
            -e HOME=/tmp \
            -e PYTHONDONTWRITEBYTECODE=1 \
            -e THEANO_FLAGS=device=cpu,floatX=float32,base_compiledir=/tmp/theano \
            -v "${GITHUB_WORKSPACE}/python/model1:/work/model1:ro" \
            -w /work/model1 \
            "${IMAGE}" /bin/bash -s <<'CONTAINER_SCRIPT'
          set -eu
          test "$(id -u)" != 0
          test ! -e /work/data
          python - <<'PYTHON_GRAPH'
          from __future__ import print_function
          import numpy as np
          import theano
          import theano.tensor as T
          from optimizers import optimizer
          from SS_M1 import SS_M1
          from utils import floatX

          def compile_scalar_adam(name, learning_rate):
              parameter = theano.shared(np.asarray(1.0, dtype=floatX), name=name)
              gradient = T.constant(np.asarray(1.0, dtype=floatX))
              opt = optimizer([parameter], [gradient], learning_rate)
              updates = opt.adam()
              step = theano.function([], parameter, updates=updates)
              return parameter, opt, step

          p_reference, opt_reference, step_reference = compile_scalar_adam('lr_reference', 0.0001)
          p_after, opt_after, step_after = compile_scalar_adam('lr_after_compile', 0.0001)
          p_control, opt_control, step_control = compile_scalar_adam('lr_precompile_control', 0.5)
          opt_after.learning_decay(decay_rate=5000.0, every_epoch=1, epoch=1, min_lr=0.0)

          step_reference()
          step_after()
          step_control()
          delta_reference = float(np.asarray(1.0, dtype=floatX) - p_reference.get_value())
          delta_after = float(np.asarray(1.0, dtype=floatX) - p_after.get_value())
          delta_control = float(np.asarray(1.0, dtype=floatX) - p_control.get_value())
          print('LR_PYTHON_ATTRIBUTE_AFTER_DECAY={}'.format(opt_after.lr))
          print('LR_DELTA_REFERENCE={:.12g}'.format(delta_reference))
          print('LR_DELTA_CHANGED_AFTER_COMPILE={:.12g}'.format(delta_after))
          print('LR_DELTA_PRECOMPILE_CONTROL={:.12g}'.format(delta_control))
          print('LR_COMPILED_GRAPH_CHANGED={}'.format(not np.allclose(delta_reference, delta_after, rtol=0.0, atol=0.0)))
          assert np.allclose(delta_reference, delta_after, rtol=0.0, atol=0.0)
          assert not np.allclose(delta_reference, delta_control, rtol=1e-5, atol=1e-8)

          class Args(object):
              pass

          args = Args()
          args.lr_u = 0.0001
          args.lr_l = 0.0001
          args.batch_size = 4
          args.hdim_cls = [4]
          args.hdim_enc = [3]
          args.hdim_dec = [3]
          args.hdim_gmm = [3]
          args.zdim = 3
          args.dec = 'gaussian'
          args.num_k = 2
          args.nlayers_enc = 1
          args.nlayers_dec = 1
          args.nlayers_cls = 1
          args.nlayers_gmm = 1
          args.dropout_rate = 0.0
          args.hl_activation = 'softplus'

          alpha_initial = 12.084761597938146
          model = SS_M1(7, 2, alpha_initial, args)
          model.labeled_cost()
          loss_fn = theano.function(
              inputs=[
                  model.x,
                  model.eps,
                  model.labels,
                  model.y_in_enc,
                  model.y_in_gmm,
                  model.training_mode,
              ],
              outputs=model.labeled_cost,
              no_default_updates=True,
          )

          rng = np.random.RandomState(808)
          x = rng.normal(0.0, 0.2, size=(args.batch_size, 7)).astype(floatX)
          eps = rng.normal(0.0, 1.0, size=(args.batch_size, args.zdim)).astype(floatX)
          labels = np.eye(2, dtype=floatX)[np.asarray([0, 1, 0, 1])]
          mode = np.asarray(0.0, dtype=floatX)
          call_args = [x, eps, labels, labels, labels, mode]
          loss_before = float(loss_fn(*call_args))
          model.alpha_annealing(
              decay_rate=0,
              every_epoch=1,
              epoch=0,
              max_epoch=100,
              min_alpha=0.0,
              max_alpha=alpha_initial,
              mode='increase',
          )
          loss_after = float(loss_fn(*call_args))
          print('ALPHA_INITIAL={:.12g}'.format(alpha_initial))
          print('ALPHA_PYTHON_ATTRIBUTE_AFTER_ANNEAL={:.12g}'.format(model.alpha))
          print('ALPHA_LOSS_BEFORE={:.12g}'.format(loss_before))
          print('ALPHA_LOSS_AFTER={:.12g}'.format(loss_after))
          print('ALPHA_COMPILED_LOSS_CHANGED={}'.format(loss_before != loss_after))
          assert model.alpha != alpha_initial
          assert np.isfinite(loss_before) and np.isfinite(loss_after)
          assert loss_before == loss_after
          print('COMPILED_SCHEDULE_CHECK=PASS')
          PYTHON_GRAPH

          if [ -e mlp.py ]; then
            echo 'VAE_MLP_MODULE=present'
          else
            echo 'VAE_MLP_MODULE=missing'
          fi
          grep -n "parser.add_argument('--batch_size', default=100)" training_model1.py
          grep -n "parser.add_argument('--dset', default = 'cards'" training_model1.py
          echo 'STATIC_COMPATIBILITY_CHECK=PASS_WITH_REPORTED_BLOCKERS'
          CONTAINER_SCRIPT

